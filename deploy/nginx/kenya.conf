# Kenya SME Platform — nginx site
#
# Install:
#   sudo cp deploy/nginx/kenya.conf /etc/nginx/sites-available/kenya
#   sudo ln -sf /etc/nginx/sites-available/kenya /etc/nginx/sites-enabled/kenya
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS:
#   sudo certbot --nginx -d <your-domain>

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The backend accepts JSON bodies up to 10mb.
    client_max_body_size 12m;

    root /opt/kenya-sme/frontend/dist;
    index index.html;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> NestJS on 4100. No trailing slash on proxy_pass so the
    # original /api/v1/... URI is preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger UI served by the backend at /docs
    location /docs {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak the built app's source maps / dotfiles
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}