<!doctype html>
<html lang="en" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob: http: https:; script-src * 'self' 'unsafe-inline' 'unsafe-eval' http: https:; style-src * 'self' 'unsafe-inline' http: https:; connect-src * 'self' http: https: ws: wss:;">
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Optimas Technologies Ltd business system — stock, sales, invoices and daily transaction reports." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Optimas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icons/favicon-256.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/favicon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Optimas Technologies</title>
    <style>
      /* No launch splash: until the app renders, the page is plain white. */
      html.booting, html.booting body { background: #ffffff; }
    </style>
  </head>
  <body>
    <script>
      // The browser may say "this app can be installed" before the app's code
      // has loaded; keep that event so the install prompt can use it later.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPromptEvent = e;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Once the app has rendered, let it paint its own backgrounds and status bar
      (function () {
        function ready() {
          document.documentElement.classList.remove('booting');
          window.dispatchEvent(new Event('splash-hidden'));
        }
        document.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          var observer = new MutationObserver(function () {
            if (root.hasChildNodes()) {
              observer.disconnect();
              ready();
            }
          });
          observer.observe(root, { childList: true });
          setTimeout(function () {
            observer.disconnect();
            ready();
          }, 4000);
        });
      })();
    </script>
  </body>
</html>
